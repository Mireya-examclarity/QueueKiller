<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QueueKiller</title>
<style>
body{
  background:#ffffff;
  color:#1a1a1a;
  font-family: Arial, sans-serif;
  padding:15px;
  /* soft colorful blobs */
  background-image: 
    radial-gradient(600px at 15% 10%, rgba(255,140,50,0.25), transparent 60%),
    radial-gradient(500px at 90% 20%, rgba(168,85,247,0.18), transparent 60%),
    radial-gradient(700px at 50% 90%, rgba(255,90,90,0.12), transparent 60%);
  background-attachment: fixed;
}
h1{
  text-align:center; 
  font-size:44px; 
  font-weight:800;
  color:#ff6a00;
  text-shadow: 0 0 20px rgba(255,106,0,0.4);
  margin-top:20px;
}
.sub{text-align:center; color:#6b6b6b; font-size:14px; margin:8px 0 22px 0;}

.box{
  background: rgba(255,255,255,0.65);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border:1px solid rgba(255,106,0,0.18);
  border-radius:18px;
  padding:20px;
  max-width:680px;
  margin:18px auto;
  box-shadow: 
    0 8px 32px rgba(255,106,0,0.12),
    0 0 0 1px rgba(255,255,255,0.8) inset;
}
.box h3{color:#ff6a00; margin-bottom:12px; font-size:16px;}

input, select{
  width:100%;
  padding:11px 12px;
  margin:5px 0;
  border-radius:10px;
  border:1px solid rgba(255,106,0,0.25);
  background: rgba(255,255,255,0.9);
  color:#222;
  outline:none;
}
input:focus, select:focus{
  border-color:#ff6a00;
  box-shadow:0 0 0 3px rgba(255,106,0,0.15);
}
.row{display:flex; gap:8px;}
.row > *{flex:1;}

button{
  padding:11px 16px;
  border-radius:10px;
  border:none;
  font-weight:bold;
  cursor:pointer;
  margin-top:6px;
  transition:0.2s;
}
.btn1{
  background: linear-gradient(90deg,#ff6a00,#ff8c32);
  color:white;
  box-shadow: 0 4px 18px rgba(255,106,0,0.35), 0 0 12px rgba(255,106,0,0.25);
}
.btn1:hover{transform: translateY(-1px); box-shadow: 0 6px 24px rgba(255,106,0,0.45);}
.btn2{
  background: rgba(255,255,255,0.8);
  color:#ff6a00;
  border:1px solid rgba(255,106,0,0.25);
}
.btn2:hover{background:white;}

#serving{
  text-align:center;
  font-size:42px;
  font-weight:800;
  color:#ff6a00;
  margin:10px 0;
  text-shadow: 0 0 20px rgba(255,106,0,0.5);
  animation: neonPulse 1.8s infinite;
}
@keyframes neonPulse{
  0%,100%{text-shadow: 0 0 12px rgba(255,106,0,0.4);}
  50%{text-shadow: 0 0 28px rgba(255,106,0,0.8), 0 0 45px rgba(255,106,0,0.4);}
}
.info{text-align:center; color:#666; font-size:13px;}
.tip{text-align:center; color:#ff6a00; font-size:12px; margin-top:6px; font-weight:bold;}
.line{
  display:flex;
  justify-content:space-between;
  padding:10px 0;
  border-bottom:1px solid rgba(255,106,0,0.08);
  font-size:13px;
}
.badge{
  background: rgba(255,106,0,0.12);
  color:#ff6a00;
  border:1px solid rgba(255,106,0,0.2);
  padding:2px 8px;
  border-radius:20px;
  font-size:10px;
  margin-left:4px;
  font-weight:bold;
}
.wait{
  background: rgba(255,106,0,0.1);
  color:#ff6a00;
  padding:4px 10px;
  border-radius:20px;
  font-size:11px;
  font-weight:bold;
}
#my-token{color:#ff6a00; font-weight:bold; margin-top:10px; text-shadow: 0 0 12px rgba(255,106,0,0.3);}
</style>
</head>
<body>

<h1>QueueKiller</h1>
<p class="sub">We waste 20–30 minutes waiting in queues. QueueKiller helps save that time.</p>

<div class="box">
<h3>🎫 Get Token - <span id="loc-label">Canteen</span></h3>
<input id="name" placeholder="your name" maxlength="30">
<div class="row">
<select id="loc"></select>
<select id="mood"></select>
</div>
<button class="btn1" id="join-btn" onclick="joinQ()">Get Token Q001</button>
<p id="my-token"></p>
<p id="feedback" class="info"></p>
</div>

<div class="box">
<h3>📺 Live Board</h3>
<div id="serving">--</div>
<p id="count" class="info"></p>
<p id="tip" class="tip"></p>
<div id="list" style="margin-top:10px;"></div>
</div>

<div class="box">
<h3>🔒 Owner Zone</h3>
<input id="owner-pin" placeholder="PIN 1234" style="width:150px;">
<br>
<button class="btn1" onclick="callNext()">Call Next</button>
<button class="btn2" onclick="clearAll()">Clear All</button>
<button class="btn2" onclick="addDemo()">+ Demo</button>
<p id="owner-msg" class="info" style="margin-top:8px;"></p>
</div>

<script>
let current="Canteen", reqId=0, timers={};
function showMsg(id,txt){
  let el=document.getElementById(id);
  el.textContent=txt;
  if(timers[id]) clearTimeout(timers[id]);
  timers[id]=setTimeout(()=>{el.textContent="";},3000);
}
fetch("/api/locations").then(r=>r.json()).then(d=>{
  let locSel=document.getElementById("loc"), moodSel=document.getElementById("mood");
  d.locations.forEach(l=>{let o=document.createElement("option");o.value=l;o.textContent=l;locSel.appendChild(o);});
  d.moods.forEach(m=>{let o=document.createElement("option");o.value=m;o.textContent=m;moodSel.appendChild(o);});
  current=d.locations[0]; document.getElementById("loc-label").textContent=current; load();
});
document.getElementById("loc").onchange=function(){current=this.value; document.getElementById("loc-label").textContent=current; load();};
function joinQ(){
  let name=document.getElementById("name").value.trim();
  if(!name){showMsg("feedback","Enter name"); return;}
  let btn=document.getElementById("join-btn"); btn.disabled=true; btn.textContent="Getting...";
  fetch("/api/join",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:name, location:document.getElementById("loc").value, mood:document.getElementById("mood").value})})
  .then(r=>r.json()).then(d=>{
    document.getElementById("my-token").textContent=d.message + " | Wait: " + d.wait + " mins";
    showMsg("feedback","Saved! Chill anywhere"); load();
  }).catch(()=>showMsg("feedback","Failed")).finally(()=>{btn.disabled=false; btn.textContent="Get Token Q001";});
}
function load(){
  reqId++; let myId=reqId;
  fetch("/api/queue?location="+current).then(r=>r.json()).then(d=>{
    if(myId!=reqId) return;
    document.getElementById("serving").textContent=d.serving? "NOW: " + d.serving.token + " - " + d.serving.name : "--";
    document.getElementById("count").textContent=d.message;
    document.getElementById("tip").textContent=d.tip;
    let list=document.getElementById("list"); list.innerHTML="";
    d.queue.forEach(p=>{
      let row=document.createElement("div"); row.className="line";
      let left=document.createElement("span"); left.innerHTML="<b>"+p.token+"</b> "+p.name+" <span class='badge'>"+p.mood+"</span>";
      let right=document.createElement("span"); right.className="wait";
      if(p.status=="waiting") right.textContent=p.wait+" min";
      else if(p.status=="serving") right.textContent="Serving now";
      else right.textContent="done";
      if(p.status=="serving") row.style.color="#ff6a00";
      row.appendChild(left); row.appendChild(right); list.appendChild(row);
    });
  });
}
function getPin(){return document.getElementById("owner-pin").value;}
function callNext(){fetch("/api/next",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({location:current,pin:getPin()})}).then(r=>{if(r.status==403) throw Error("pin"); return r.json();}).then(d=>{showMsg("owner-msg",d.now?"Now "+d.now:"No one"); load();}).catch(e=>showMsg("owner-msg",e.message=="pin"?"Wrong PIN":"Failed"));}
function clearAll(){if(!confirm("Clear?")) return; fetch("/api/clear",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({location:current,pin:getPin()})}).then(r=>{if(r.status==403) throw Error("pin"); return r.json();}).then(()=>{showMsg("owner-msg","Cleared"); load();}).catch(e=>showMsg("owner-msg",e.message=="pin"?"Wrong PIN":"Failed"));}
function addDemo(){fetch("/api/demo",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({location:current,pin:getPin()})}).then(r=>{if(r.status==403) throw Error("pin"); return r.json();}).then(d=>{showMsg("owner-msg",d.message); load();}).catch(e=>showMsg("owner-msg",e.message=="pin"?"Wrong PIN":"Failed"));}
setInterval(load,3000);
</script>
</body>
</html>

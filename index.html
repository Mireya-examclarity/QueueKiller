<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QueueKiller</title>
<style>
body{
  background:#18120d;
  color:white;
  font-family: Arial, sans-serif;
  padding:15px;
}
h1{text-align:center; color:#ff8c32; margin-top:25px;}
.sub{text-align:center; color:#9a8a7a; font-size:14px; margin-bottom:20px;}
.box{
  background:#221c14;
  border:1px solid #3a2f22;
  border-radius:10px;
  padding:18px;
  max-width:650px;
  margin:18px auto;
}
.box h3{color:#ffad60; margin-bottom:10px;}
input, select{
  width:100%;
  padding:10px;
  margin:5px 0;
  border-radius:6px;
  border:1px solid #4a3d2b;
  background:#15110d;
  color:white;
}
.row{display:flex; gap:8px;}
.row > *{flex:1;}
button{
  padding:10px 14px;
  border-radius:6px;
  border:none;
  font-weight:bold;
  cursor:pointer;
  margin-top:6px;
}
.btn1{background:#ff8c32; color:black;}
.btn2{background:#2a231b; color:#c9b8a2; border:1px solid #4a3d2b;}
#serving{
  text-align:center;
  font-size:38px;
  font-weight:bold;
  color:#ff8c32;
  margin:10px 0;
}
.info{text-align:center; color:#9a8a7a; font-size:13px;}
.tip{text-align:center; color:#ffcc70; font-size:12px; margin-top:5px;}
.line{
  display:flex;
  justify-content:space-between;
  padding:8px 0;
  border-bottom:1px solid #2e261b;
  font-size:13px;
}
.badge{
  background:#2e261b;
  color:#ffad60;
  padding:2px 6px;
  border-radius:10px;
  font-size:10px;
  margin-left:4px;
}
#my-token{color:#ff8c32; font-weight:bold; margin-top:10px;}
</style>
</head>
<body>

<h1>QueueKiller</h1>
<p class="sub">We waste 20-30 minutes waiting in queues. QueueKiller helps save that time.</p>

<div class="box">
<h3>Get Token - <span id="loc-label">Canteen</span></h3>
<input id="name" placeholder="your name" maxlength="30">
<div class="row">
<select id="loc"></select>
<select id="mood"></select>
</div>
<button class="btn1" id="join-btn" onclick="joinQ()">Get Token</button>
<p id="my-token"></p>
<p id="feedback" class="info"></p>
</div>

<div class="box">
<h3>Live Board</h3>
<div id="serving">--</div>
<p id="count" class="info"></p>
<p id="tip" class="tip"></p>
<div id="list"></div>
</div>

<div class="box">
<h3>Owner Controls</h3>
<input id="owner-pin" placeholder="PIN is 1234" style="width:150px;">
<br>
<button class="btn1" onclick="callNext()">Call Next</button>
<button class="btn2" onclick="clearAll()">Clear All</button>
<button class="btn2" onclick="addDemo()">Add Demo</button>
<p id="owner-msg" class="info" style="margin-top:8px;"></p>
</div>

<script>
let current = "Canteen";
let last = null;
let reqId = 0;
let timers = {};

function showMsg(id, txt){
  let el = document.getElementById(id);
  el.textContent = txt;
  if(timers[id]){
    clearTimeout(timers[id]);
  }
  timers[id] = setTimeout(function(){
    el.textContent = "";
  }, 3000);
}

// load locations
fetch("/api/locations").then(function(r){return r.json();}).then(function(d){
  let locSel = document.getElementById("loc");
  let moodSel = document.getElementById("mood");
  for(let i=0;i<d.locations.length;i++){
    let o = document.createElement("option");
    o.value = d.locations[i];
    o.textContent = d.locations[i];
    locSel.appendChild(o);
  }
  for(let i=0;i<d.moods.length;i++){
    let o = document.createElement("option");
    o.value = d.moods[i];
    o.textContent = d.moods[i];
    moodSel.appendChild(o);
  }
  current = d.locations[0];
  document.getElementById("loc-label").textContent = current;
  load();
});

document.getElementById("loc").onchange = function(){
  current = this.value;
  document.getElementById("loc-label").textContent = current;
  load();
}

function joinQ(){
  let name = document.getElementById("name").value.trim();
  if(name == ""){
    showMsg("feedback","Enter name first");
    return;
  }
  let btn = document.getElementById("join-btn");
  btn.disabled = true;
  btn.textContent = "wait...";

  let loc = document.getElementById("loc").value;
  let mood = document.getElementById("mood").value;

  fetch("/api/join",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({name:name, location:loc, mood:mood})
  }).then(function(r){return r.json();}).then(function(d){
    document.getElementById("my-token").textContent = d.message + " Wait: " + d.wait + " mins";
    showMsg("feedback","Done! Wait anywhere");
    load();
  }).catch(function(){
    showMsg("feedback","Failed try again");
  }).finally(function(){
    btn.disabled = false;
    btn.textContent = "Get Token";
  });
}

function load(){
  reqId = reqId + 1;
  let myId = reqId;
  fetch("/api/queue?location="+current).then(function(r){return r.json();}).then(function(d){
    if(myId != reqId){
      return; // old request, ignore
    }
    let el = document.getElementById("serving");
    if(d.serving){
      el.textContent = "NOW: " + d.serving.token + " - " + d.serving.name;
    } else {
      el.textContent = "--";
    }

    document.getElementById("count").textContent = d.message;
    document.getElementById("tip").textContent = d.tip;

    let list = document.getElementById("list");
    list.innerHTML = "";
    for(let i=0;i<d.queue.length;i++){
      let p = d.queue[i];
      let row = document.createElement("div");
      row.className = "line";
      let left = document.createElement("span");
      left.innerHTML = "<b>" + p.token + "</b> " + p.name + " <span class='badge'>" + p.mood + "</span>";
      let right = document.createElement("span");
      if(p.status == "waiting"){
        right.textContent = p.wait + " min";
      } else if(p.status == "serving"){
        right.textContent = "Serving";
        row.style.color = "#ff8c32";
      } else {
        right.textContent = "done";
      }
      row.appendChild(left);
      row.appendChild(right);
      list.appendChild(row);
    }
  });
}

function getPin(){
  return document.getElementById("owner-pin").value;
}

function callNext(){
  fetch("/api/next",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({location:current, pin:getPin()})
  }).then(function(r){
    if(r.status == 403){
      throw new Error("pin");
    }
    return r.json();
  }).then(function(d){
    if(d.now){
      showMsg("owner-msg","Now " + d.now);
    } else {
      showMsg("owner-msg","no one waiting");
    }
    load();
  }).catch(function(e){
    if(e.message == "pin"){
      showMsg("owner-msg","Wrong PIN");
    } else {
      showMsg("owner-msg","failed");
    }
  });
}

function clearAll(){
  if(!confirm("Clear?")) return;
  fetch("/api/clear",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({location:current, pin:getPin()})
  }).then(function(r){
    if(r.status == 403) throw new Error("pin");
    return r.json();
  }).then(function(){
    showMsg("owner-msg","cleared");
    load();
  }).catch(function(e){
    if(e.message == "pin") showMsg("owner-msg","Wrong PIN");
    else showMsg("owner-msg","failed");
  });
}

function addDemo(){
  fetch("/api/demo",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({location:current, pin:getPin()})
  }).then(function(r){
    if(r.status == 403) throw new Error("pin");
    return r.json();
  }).then(function(d){
    showMsg("owner-msg",d.message);
    load();
  }).catch(function(e){
    if(e.message == "pin") showMsg("owner-msg","Wrong PIN");
    else showMsg("owner-msg","failed");
  });
}

setInterval(load, 3000);
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<title>QueueKiller - Skip The Line</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Outfit:wght@400;600&display=swap" rel="stylesheet">
<style>
*{font-family:'Outfit',sans-serif}
h1,h2{font-family:'Space Grotesk',sans-serif}
body{background:#f7f7ff;padding:20px}
.main-title{font-size:3rem;font-weight:800;background:linear-gradient(90deg,#FF6B6B,#FFD93D,#6BCB77,#4D96FF);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-align:center}
.glass{background:rgba(255,255,255,0.9);backdrop-filter:blur(10px);border-radius:20px;padding:20px;box-shadow:0 8px 32px rgba(0,0,0,0.1);margin-bottom:15px}
.now-card{background:linear-gradient(135deg,#a8edea 0%,#fed6e3 100%);border-left:8px solid #00c853;border-radius:20px;padding:20px;animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(0,200,83,0.4)}70%{box-shadow:0 0 0 15px rgba(0,200,83,0)}100%{box-shadow:0 0 0 0 rgba(0,200,83,0)}}
.wait-card{background:linear-gradient(135deg,#ffecd2 0%,#fcb69f 100%);border-radius:15px;padding:15px;margin:8px 0}
button{border-radius:30px!important;font-weight:700;background:linear-gradient(90deg,#4D96FF,#6BCB77);color:white;border:none;padding:12px 24px;cursor:pointer}
input,select{width:100%;padding:12px;border-radius:10px;border:1px solid #ddd;margin:8px 0}
</style>
</head>
<body>
<h1 class="main-title">⚡ QueueKiller</h1>
<p style="text-align:center"><i>Skip the line. Live your life.</i><br>Real Kochi problem: 30 mins waste in canteen queue. We fix it.</p>

<div style="display:flex;gap:20px;flex-wrap:wrap">
<div style="flex:1;min-width:300px">
<div class="glass">
<h3>🎫 Get Your Digital Token</h3>
<input id="name" placeholder="Your Name - e.g. Sanjay">
<select id="place"><option>🍛 College Canteen</option><option>🖨️ Xerox Shop</option><option>💊 Clinic</option><option>🚌 Bus Counter</option><option>💰 Fees Office</option></select>
<select id="vibe"><option>😎 Chill</option><option>⏰ Normal</option><option>🔥 Urgent</option></select>
<button onclick="add()" style="width:100%;margin-top:10px">🚀 GENERATE MY TOKEN</button>
</div>
<div class="glass">
<p>⏳ In Line: <b id="count">0</b> | ✅ Served: <b id="served">0</b></p>
<p id="tip"></p>
</div>
</div>

<div style="flex:1.4;min-width:300px">
<h3>📺 Live Board - Who's Next?</h3>
<div id="board"></div>
<div style="margin-top:20px">
<button onclick="next()">➡️ Call Next</button>
<button onclick="clearAll()">🗑️ Clear</button>
<button onclick="demo()">🤖 Demo Data</button>
</div>
</div>
</div>

<script>
let queue=[],counter=1,served=0
function add(){
 let n=document.getElementById('name').value
 if(!n){alert('Name needed bro!');return}
 let p=document.getElementById('place').value
 let v=document.getElementById('vibe').value
 queue.push({token:`Q${String(counter).padStart(3,'0')}`,name:n,place:p,vibe:v,time:new Date().toLocaleTimeString(),status:'waiting',color:'#4D96FF'})
 counter++;document.getElementById('name').value='';render()
}
function render(){
 let waiting=queue.filter(q=>q.status=='waiting')
 document.getElementById('count').innerText=waiting.length
 document.getElementById('served').innerText=served
 document.getElementById('tip').innerText=waiting.length>=3?'☕ Pro Tip: You have 6+ mins! Go grab chai & come back.':''
 let board=document.getElementById('board')
 if(waiting.length==0){board.innerHTML='<div class="glass" style="text-align:center;padding:40px"><h1>🎉</h1><h2>No Queue!</h2><p>Walk in like VIP</p></div>';return}
 let html=''
 waiting.forEach((person,i)=>{
  if(i==0) html+=`<div class="now-card"><h2>🔔 NOW SERVING</h2><h1>${person.token} - ${person.name}</h1><p>${person.place} | ${person.vibe} | ${person.time}</p><b>→ Proceed to counter NOW</b></div>`
  else html+=`<div class="wait-card"><b style="color:${person.color}">${person.token}</b> <b>${person.name}</b> - ${person.place}<br><small>⏳ ${i} ahead | ~${i*2} min | ${person.time}</small></div>`
 })
 board.innerHTML=html
}
function next(){let f=queue.find(q=>q.status=='waiting');if(f){f.status='done';served++;render()}}
function clearAll(){queue=[];counter=1;render()}
function demo(){['Rahul','Aisha','Arjun'].forEach(n=>{queue.push({token:`Q${String(counter).padStart(3,'0')}`,name:n,place:'🍛 College Canteen',vibe:'⏰ Normal',time:new Date().toLocaleTimeString(),status:'waiting',color:'#4D96FF'});counter++});render()}
render()
</script>
</body>
</html>
